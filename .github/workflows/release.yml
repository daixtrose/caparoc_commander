name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CMAKE_VERSION: "4.2.3"

jobs:
  build-linux-x86_64:
    # x86_64 build is for GitHub Releases only; scm publishes only arm64.
    if: ${{ vars.IS_SCM != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git credentials for FetchContent
        run: |
          TOKEN="${{ secrets.FETCHCONTENT_GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        run: |
          wget -qO- https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz | tar xz
          echo "$PWD/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config autoconf automake libtool make gcc dpkg-dev rpm

      - name: Configure
        env:
          CXX: g++-14
        run: cmake --preset linux-x86_64-release

      - name: Build
        run: cmake --build --preset linux-x86_64-release --parallel

      - name: Package
        run: |
          cpack --preset linux-x86_64-release
          mkdir -p artifacts
          find build/linux-x86_64-release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifacts/ \;

      - name: Upload artifacts
        if: ${{ vars.IS_SCM != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: caparoc-commander-linux-x86_64
          path: artifacts/

  build-linux-aarch64:
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.IS_SCM == 'true' && 'scm.ird-cloud.de/ird/cross-build-trixie-arm64:latest' || 'ghcr.io/daixtrose/cross-build-trixie-arm64:latest' }}
      credentials:
        username: ${{ vars.IS_SCM == 'true' && 'ird-deb-publisher' || '' }}
        password: ${{ vars.IS_SCM == 'true' && secrets.SCM_DEB_PUBLISHER_TOKEN || '' }}
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git credentials for FetchContent
        run: |
          TOKEN="${{ secrets.FETCHCONTENT_GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Configure
        run: cmake --preset linux-aarch64-release

      - name: Build
        run: cmake --build --preset linux-aarch64-release --parallel

      - name: Package
        run: |
          cpack --preset linux-aarch64-release
          mkdir -p artifacts
          find build/linux-aarch64-release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifacts/ \;

      - name: Verify Trixie compatibility (GLIBC <= 2.41)
        shell: bash
        run: |
          set -euo pipefail
          dpkg -x build/linux-aarch64-release/*.deb /tmp/trixie-compat-check
          MAX_GLIBC="2.41"
          echo "Checking all ELF binaries require at most GLIBC ${MAX_GLIBC} ..."
          fail=0
          for f in $(find /tmp/trixie-compat-check -type f); do
            file "$f" | grep -q "ELF" || continue
            max=$(readelf -V "$f" 2>/dev/null \
              | grep -oP 'GLIBC_\K[0-9.]+' | sort -V -u | tail -1)
            [ -z "$max" ] && continue
            if [ "$(printf '%s\n%s' "$MAX_GLIBC" "$max" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "::error::$(basename "$f") requires GLIBC ${max} (max allowed: ${MAX_GLIBC})"
              readelf --dyn-syms -W "$f" | grep -vE 'GLIBC_2\.(1[0-9]|2[0-9]|3[0-6])' | grep 'GLIBC_' || true
              fail=1
            else
              echo "✓ $(basename "$f"): GLIBC ${max}"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload artifacts
        if: ${{ vars.IS_SCM != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: caparoc-commander-linux-aarch64
          path: artifacts/

      # ── Forgejo path: publish arm64 deb from this job ────────────
      - name: Upload .deb to scm.ird-cloud.de registry (Forgejo path)
        if: ${{ vars.IS_SCM == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          SCM_USER:         ird-deb-publisher
          SCM_TOKEN:        ${{ secrets.SCM_DEB_PUBLISHER_TOKEN }}
          TARGET_SUITE:     trixie
          TARGET_COMPONENT: main
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 || \
              (apt-get update && apt-get install -y --no-install-recommends curl)
          DEB=$(ls artifacts/*_arm64.deb 2>/dev/null)
          if [ -z "$DEB" ]; then echo "::error::no arm64 deb in artifacts/"; exit 1; fi
          URL="https://scm.ird-cloud.de/api/packages/ird/debian/pool/${TARGET_SUITE}/${TARGET_COMPONENT}/upload"
          HTTP=$(curl -sS -X PUT --user "${SCM_USER}:${SCM_TOKEN}" --upload-file "${DEB}" \
                      -o /tmp/upload.resp -w "%{http_code}" "${URL}")
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::upload failed (HTTP $HTTP)"
            head -c 500 /tmp/upload.resp; echo
            exit 1
          fi
          echo "✓ uploaded $(basename "${DEB}") (HTTP $HTTP)"

      - name: Create Forgejo Release (Forgejo path)
        if: ${{ vars.IS_SCM == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          API_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GITEA_HOST: https://scm.ird-cloud.de
          REPO_NAME:  ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 || \
              (apt-get update && apt-get install -y --no-install-recommends curl)
          # Hardcode org=ird; GITHUB_REPOSITORY on Forgejo pull-mirrors can
          # resolve to the upstream path and 404 on POST.
          API="${GITEA_HOST}/api/v1/repos/ird/${REPO_NAME}"
          TAG="${GITHUB_REF_NAME}"
          GET_HTTP=$(curl -sS -o /tmp/rel.json -w "%{http_code}" \
                          -H "Authorization: token ${API_TOKEN}" \
                          "${API}/releases/tags/${TAG}")
          if [ "$GET_HTTP" = "200" ]; then
            REL_ID=$(grep -oE '"id":[0-9]+' /tmp/rel.json | head -1 | grep -oE '[0-9]+')
          else
            BODY=$(printf '{"tag_name":"%s","name":"%s","draft":false,"prerelease":false}' "$TAG" "$TAG")
            POST_HTTP=$(curl -sS -o /tmp/rel.json -w "%{http_code}" \
                             -X POST -H "Authorization: token ${API_TOKEN}" \
                             -H "Content-Type: application/json" -d "$BODY" "${API}/releases")
            if [ "$POST_HTTP" -lt 200 ] || [ "$POST_HTTP" -ge 300 ]; then
              echo "::error::release create failed (HTTP $POST_HTTP)"
              head -c 500 /tmp/rel.json; echo
              exit 1
            fi
            REL_ID=$(grep -oE '"id":[0-9]+' /tmp/rel.json | head -1 | grep -oE '[0-9]+')
          fi
          [ -n "${REL_ID:-}" ] || { echo "::error::could not resolve release id"; exit 1; }
          for f in artifacts/*; do
            UP=$(curl -sS -o /tmp/asset.json -w "%{http_code}" -X POST \
                       -H "Authorization: token ${API_TOKEN}" \
                       -F "attachment=@${f}" \
                       "${API}/releases/${REL_ID}/assets?name=$(basename "$f")")
            if [ "$UP" -lt 200 ] || [ "$UP" -ge 300 ]; then
              echo "::error::asset upload failed for $(basename "$f") (HTTP $UP)"
              head -c 500 /tmp/asset.json; echo
              exit 1
            fi
            echo "  ✓ attached $(basename "$f") (HTTP $UP)"
          done

  build-windows-x86_64:
    # Windows build is for GitHub Releases only.  Skip on Forgejo.
    if: ${{ vars.IS_SCM != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            autoconf
            automake
            libtool
            make
            pkg-config
            gettext
            git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git credentials for FetchContent
        run: |
          TOKEN="${{ secrets.FETCHCONTENT_GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Configure
        run: cmake --preset windows-x86_64-release

      - name: Prepare autotools
        run: |
          cd build/windows-x86_64-release/_deps/libmodbus-src
          ./autogen.sh

      - name: Build
        run: cmake --build --preset windows-x86_64-release --parallel

      - name: Package
        run: |
          cpack --preset windows-x86_64-release
          mkdir -p artifacts
          find build/windows-x86_64-release -maxdepth 1 -type f -name '*.zip' -exec cp {} artifacts/ \;

      - name: Upload artifacts
        if: ${{ vars.IS_SCM != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: caparoc-commander-windows-x86_64
          path: artifacts/

  publish:
    # Job 2 runs only on GitHub; on Forgejo aarch64 publishes itself.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.IS_SCM != 'true' }}
    needs: [build-linux-x86_64, build-linux-aarch64, build-windows-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: caparoc-commander-linux-x86_64
          path: artifacts

      - name: Download Linux aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: caparoc-commander-linux-aarch64
          path: artifacts

      - name: Download Windows x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: caparoc-commander-windows-x86_64
          path: artifacts

      # ── Upload arm64 .deb to scm.ird-cloud.de Debian registry ────
      # See cpp-java-package-distribution-proposal.md §4.3 / §5.5.
      - name: Upload .deb to scm.ird-cloud.de registry
        if: vars.IS_SCM == 'true'
        env:
          SCM_USER:         ird-deb-publisher
          SCM_TOKEN:        ${{ secrets.SCM_DEB_PUBLISHER_TOKEN }}
          TARGET_SUITE:     trixie
          TARGET_COMPONENT: main
        run: |
          set -euo pipefail
          DEB=$(ls artifacts/*_arm64.deb 2>/dev/null)
          if [ -z "$DEB" ]; then echo "::error::no arm64 deb in artifacts/"; exit 1; fi
          URL="https://scm.ird-cloud.de/api/packages/ird/debian/pool/${TARGET_SUITE}/${TARGET_COMPONENT}/upload"
          HTTP=$(curl -sS -X PUT \
                      --user "${SCM_USER}:${SCM_TOKEN}" \
                      --upload-file "${DEB}" \
                      -o /tmp/upload.resp -w "%{http_code}" "${URL}")
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::upload failed (HTTP $HTTP)"
            head -c 500 /tmp/upload.resp; echo
            exit 1
          fi
          echo "✓ uploaded $(basename "${DEB}") (HTTP $HTTP)"

      - name: Create GitHub Release
        if: ${{ github.server_url == 'https://github.com' && vars.IS_SCM != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*

      - name: Create Forgejo / Gitea Release
        if: ${{ vars.IS_SCM == 'true' || github.server_url != 'https://github.com' }}
        shell: bash
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_HOST: ${{ vars.IS_SCM == 'true' && 'https://scm.ird-cloud.de' || github.server_url }}
        run: |
          set -euo pipefail
          # Hardcode org=ird; GITHUB_REPOSITORY on Forgejo pull-mirrors can
          # resolve to the upstream path and 404 on POST.
          API="${GITEA_HOST}/api/v1/repos/ird/${REPO_NAME}"
          TAG="${GITHUB_REF_NAME}"
          BODY=$(printf '{"tag_name":"%s","name":"%s","draft":false,"prerelease":false}' "$TAG" "$TAG")
          RESP=$(curl -sS -X POST -H "Authorization: token ${API_TOKEN}" -H "Content-Type: application/json" \
                      -d "$BODY" "${API}/releases" 2>/dev/null || true)
          REL_ID=$(echo "$RESP" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -fsS -H "Authorization: token ${API_TOKEN}" "${API}/releases/tags/${TAG}" \
                     | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
          fi
          for f in artifacts/*; do
            curl -fsS -X POST -H "Authorization: token ${API_TOKEN}" \
                 -H "Content-Type: application/octet-stream" \
                 --data-binary "@${f}" \
                 "${API}/releases/${REL_ID}/assets?name=$(basename "$f")" >/dev/null
            echo "  ✓ attached $(basename "$f")"
          done
